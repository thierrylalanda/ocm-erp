<div class="categories-page-container">
    <!-- Premium Header -->
    <header class="page-header d-flex justify-content-between align-items-center mb-4">
        <div class="header-title-area">
            <h2 class="premium-title">{{ 'stock.categories.title' | translate }}</h2>
            <p class="text-muted small mb-0">{{ 'stock.categories.subtitle' | translate }}</p>
        </div>

        <div class="header-actions d-flex gap-2">
            <!-- Template download with RBAC -->
            <button *hasPermissions="{ permissions: ['category.manage'] }" type="button"
                class="btn btn-outline-secondary" (click)="downloadTemplate()" title="Télécharger le modèle d'import">
                <i class="isax isax-document-download"></i>
                <span class="ms-2 d-none d-md-inline">Modèle</span>
            </button>

            <!-- Export with RBAC -->
            <button *hasPermissions="{ permissions: ['category.manage'] }" type="button" class="btn btn-outline-info"
                (click)="onExport()" title="Exporter les catégories">
                <i class="isax isax-export"></i>
                <span class="ms-2 d-none d-md-inline">Exporter</span>
            </button>

            <!-- Import with RBAC -->
            <button *hasPermissions="{ permissions: ['category.manage'] }" type="button" class="btn btn-outline-success"
                (click)="triggerImport()" title="Importer des catégories">
                <i class="isax isax-import"></i>
                <span class="ms-2 d-none d-md-inline">Importer</span>
            </button>

            <!-- Create with RBAC -->
            <button *hasPermissions="{ permissions: ['category.manage'] }" type="button" class="btn btn-primary"
                (click)="openCreateModal()">
                <i class="isax isax-add me-2"></i>
                <span>{{ 'stock.categories.create' | translate }}</span>
            </button>
        </div>
    </header>

    <div class="row">
        <div class="col-12">
            <!-- Categories Card with Glass Effect -->
            <div class="categories-card glass-effect p-4">
                <div *ngIf="loading" class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>

                <app-tree-view *ngIf="!loading" [nodes]="treeNodes" [config]="treeConfig"
                    (nodeAction)="onNodeAction($event)">
                </app-tree-view>

                <div *ngIf="!loading && treeNodes.length === 0" class="text-center py-5 text-muted">
                    <i class="isax isax-folder-open mb-2 fs-1"></i>
                    <p>{{ 'common.noData' | translate }}</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Form -->
    <app-modal [isOpen]="showModal" [config]="modalConfig" (close)="onFormCancel()">
        <div modal-body>
            <app-form-builder *ngIf="showModal" [config]="formConfig" [initialValues]="currentCategory"
                (formSubmit)="onFormSubmit($event)" (formCancel)="onFormCancel()">
            </app-form-builder>
        </div>
    </app-modal>
</div>
