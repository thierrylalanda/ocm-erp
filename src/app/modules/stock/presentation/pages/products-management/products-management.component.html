<div class="products-page-container">
    <!-- Premium Header -->
    <header class="page-header d-flex justify-content-between align-items-center mb-4">
        <div class="header-title-area">
            <h2 class="premium-title">{{ 'stock.products.title' | translate }}</h2>
            <p class="text-muted small mb-0">{{ 'stock.products.subtitle' | translate }}</p>
        </div>

        <div class="header-actions d-flex gap-2">
            <!-- Download Template with RBAC -->
            <button *hasPermissions="{ permissions: ['article.import'] }" type="button"
                class="btn btn-outline-secondary" (click)="downloadTemplate()" title="Télécharger le modèle d'import">
                <i class="isax isax-document-download"></i>
                <span class="ms-2 d-none d-md-inline">Modèle</span>
            </button>

            <!-- Import Products with RBAC -->
            <button *hasPermissions="{ permissions: ['article.import'] }" type="button" class="btn btn-outline-success"
                (click)="triggerImport()" title="Importer des produits">
                <i class="isax isax-import"></i>
                <span class="ms-2 d-none d-md-inline">Importer</span>
            </button>

            <!-- Create Product with RBAC -->
            <button *hasPermissions="{ permissions: ['article.create'] }" type="button" class="btn btn-primary"
                (click)="openCreateModal()">
                <i class="isax isax-add me-2"></i>
                <span>{{ 'stock.products.create' | translate }}</span>
            </button>
        </div>
    </header>

    <!-- DataTable Card with Glass Effect -->
    <div class="products-table-card glass-effect">
        <app-data-table [data]="products" [columns]="tableColumns" [config]="tableConfig" [loading]="loading"
            (export)="onExport()">
            <!-- Custom template for type column -->
            <ng-template #customCell let-column="column" let-row="row">
                <span *ngIf="column.key === 'type'" class="badge rounded-pill" [ngClass]="getTypeClass(row.type)">
                    {{ getTypeLabel(row.type) | translate }}
                </span>
            </ng-template>
        </app-data-table>
    </div>

    <!-- Modal Création/Édition -->
    <app-modal [isOpen]="showModal" [config]="modalConfig" (close)="showModal = false">

        <div modal-body>
            <app-form-builder [config]="formConfig" [initialValues]="currentProduct" (formSubmit)="onFormSubmit($event)"
                (formCancel)="onFormCancel()">
            </app-form-builder>
        </div>
    </app-modal>
</div>
