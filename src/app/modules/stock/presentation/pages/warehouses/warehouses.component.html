<div class="warehouses-page-container">
    <!-- Premium Header -->
    <header class="page-header d-flex justify-content-between align-items-center mb-4">
        <div class="header-title-area">
            <h2 class="premium-title">{{ 'stock.warehouses.title' | translate }}</h2>
            <p class="text-muted small mb-0">Gestion infrastructurelle des lieux de stockage</p>
        </div>

        <div class="header-actions">
            <!-- Create Warehouse Button with RBAC -->
            <button *hasPermissions="{ permissions: ['warehouse.create'] }" class="btn btn-primary"
                (click)="openCreateModal()">
                <i class="isax isax-add-circle me-2"></i>
                <span>{{ 'stock.warehouses.create' | translate }}</span>
            </button>
        </div>
    </header>

    <!-- Data Table Card -->
    <div class="warehouse-table-card glass-effect">
        <app-data-table [columns]="columns" [data]="warehouses" [loading]="loading" [config]="tableConfig">
        </app-data-table>
    </div>

    <!-- Modal -->
    <app-modal [isOpen]="showModal" [config]="modalConfig" (closed)="onFormCancel()">
        <app-form-builder *ngIf="showModal" [config]="formConfig" (submit)="onFormSubmit($event)"
            (cancel)="onFormCancel()">
        </app-form-builder>
    </app-modal>
</div>
